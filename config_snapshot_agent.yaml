# ────────────────────────────────────────────────────────────────────────────
# AI SNAPSHOT REPORTING AGENT - CONFIGURATION
# ────────────────────────────────────────────────────────────────────────────
#
# This file contains default settings for the snapshot reporting agent.
# All paths are relative to the project root.
#

# ────────────────────────────────────────────────────────────────────────────
#  LOGOS
# ────────────────────────────────────────────────────────────────────────────

logos:
  # Client logos (customize per client)
  clients:
    denodo:
      path: "logos/denodo_logo.png"
      width_inches: 1.5

    snowflake:
      path: "logos/snowflake_logo.png"
      width_inches: 1.5

  # Active logo (company branding)
  active:
    path: "logos/active_logo.png"
    width_inches: 1.5

# ────────────────────────────────────────────────────────────────────────────
#  CLIENT SETTINGS
# ────────────────────────────────────────────────────────────────────────────

clients:
  denodo:
    name: "Denodo"
    display_name: "Denodo Technologies"
    website: "https://www.denodo.com"
    logo: "logos/denodo_logo.png"

  snowflake:
    name: "Snowflake"
    display_name: "Snowflake Inc."
    website: "https://www.snowflake.com"
    logo: "logos/snowflake_logo.png"

# ────────────────────────────────────────────────────────────────────────────
#  PUBLICATIONS
# ────────────────────────────────────────────────────────────────────────────

publications:
  technewsme:
    name: "TechNews Middle East"
    url: "https://technewsme.com"
    tier: "Tier 1"
    language: "English"
    region: "Middle East"

  itpronews:
    name: "IT Pro News"
    url: "https://itpronewsmideast.com"
    tier: "Tier 1"
    language: "English"
    region: "Middle East"

  cloudjournal:
    name: "Cloud Computing Journal"
    url: "https://cloudjournal.com"
    tier: "Tier 2"
    language: "English"
    region: "Global"

# ────────────────────────────────────────────────────────────────────────────
#  DOCUMENT SETTINGS
# ────────────────────────────────────────────────────────────────────────────

document:
  # Page size and margins (in inches)
  page_width: 8.5
  page_height: 11.0
  margin_top: 0.5
  margin_bottom: 0.5
  margin_left: 0.75
  margin_right: 0.75

  # Default fonts
  fonts:
    title_size: 24
    heading_size: 14
    body_size: 11
    title_color: "#1F4E78"
    heading_color: "#366092"
    text_color: "#000000"

  # Logo header settings
  logo_header:
    height_inches: 1.0
    table_borders: true
    background_color: "#FFFFFF"

# ────────────────────────────────────────────────────────────────────────────
#  SCREENSHOT SETTINGS
# ────────────────────────────────────────────────────────────────────────────

screenshots:
  # Selenium WebDriver settings
  headless: true
  window_width: 1920
  window_height: 1080
  wait_timeout: 10  # seconds

  # Image processing
  format: "png"
  quality: 95
  max_width_inches: 6.0
  max_height_inches: 8.0

# ────────────────────────────────────────────────────────────────────────────
#  EXCEL TRACKER SETTINGS
# ────────────────────────────────────────────────────────────────────────────

tracker:
  # File location
  location: "ADC/clients/tracker.xlsx"

  # Default sheet name
  sheet_name: "Coverage"

  # Column configuration
  columns:
    - name: "Date Added"
      width: 12
      format: "YYYY-MM-DD"
    - name: "Client"
      width: 15
      format: "text"
    - name: "Source"
      width: 20
      format: "text"
    - name: "Publication"
      width: 20
      format: "text"
    - name: "Headline"
      width: 30
      format: "text"
    - name: "URL"
      width: 35
      format: "hyperlink"
    - name: "Media Type"
      width: 12
      format: "text"
    - name: "Tier"
      width: 10
      format: "text"
    - name: "UMV"
      width: 12
      format: "currency"
    - name: "Impressions"
      width: 15
      format: "number"
    - name: "Message Pull-Through"
      width: 15
      format: "percent"
    - name: "Coverage Period"
      width: 15
      format: "text"

  # Header styling
  header:
    background_color: "366092"
    text_color: "FFFFFF"
    bold: true

# ────────────────────────────────────────────────────────────────────────────
#  OUTPUT DIRECTORIES
# ────────────────────────────────────────────────────────────────────────────

directories:
  snapshots: "reports/snapshots"
  coverage: "reports/coverage"
  tracker: "ADC/clients"
  logs: "logs"
  temp: ".temp"

# ────────────────────────────────────────────────────────────────────────────
#  NAMING CONVENTIONS
# ────────────────────────────────────────────────────────────────────────────

naming:
  # Snapshot file naming
  # Format: ADC_[CLIENT]_[MAGAZINE]_[YYYYMMDD].docx
  snapshot_template: "ADC_{client}_{magazine}_{date}.docx"

  # 24-hour coverage file naming
  # Format: ADC_[CLIENT]_[CAMPAIGN]_[YYYYMMDD].docx
  coverage_template: "ADC_{client}_{campaign}_{date}.docx"

  # Tracker file naming
  # Format: ADC/clients/tracker.xlsx
  tracker_template: "ADC/clients/tracker.xlsx"

# ────────────────────────────────────────────────────────────────────────────
#  LOGGING
# ────────────────────────────────────────────────────────────────────────────

logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s [%(levelname)s] %(name)s - %(message)s"
  file: "logs/snapshot_agent.log"
  console: true

# ────────────────────────────────────────────────────────────────────────────
#  AI SETTINGS (for Anthropic API integration)
# ────────────────────────────────────────────────────────────────────────────

ai:
  # API Configuration
  provider: "anthropic"
  model: "claude-3-5-sonnet-20241022"
  api_key_env: "ANTHROPIC_API_KEY"  # Environment variable name
  max_tokens: 2048

  # AI Features
  features:
    headline_extraction: true
    topic_detection: true
    sentiment_analysis: true
    language_detection: true

  # Prompts
  prompts:
    headline_extraction: |
      Analyze this article screenshot and extract:
      1. Main headline
      2. Publication name
      3. Key topics (comma-separated)

      Format as JSON: {"headline": "...", "publication": "...", "topics": "..."}

    sentiment_analysis: |
      Analyze the sentiment of this article screenshot.
      Respond with: positive, neutral, or negative

    topic_detection: |
      Identify the main topics covered in this article.
      List as comma-separated values.

# ────────────────────────────────────────────────────────────────────────────
#  METRICS & TIERS
# ────────────────────────────────────────────────────────────────────────────

metrics:
  # Tier definitions
  tiers:
    tier_1:
      min_reach: 100000
      min_umv: 5000
      description: "Top-tier publications"

    tier_2:
      min_reach: 50000
      min_umv: 2500
      description: "Mid-tier publications"

    tier_3:
      min_reach: 10000
      min_umv: 500
      description: "Emerging publications"

  # UMV calculation
  umv:
    online_rate: 0.01  # $0.01 per 1000 impressions
    print_rate: 0.05   # $0.05 per 1000 impressions
    tv_rate: 0.15      # $0.15 per 1000 impressions
    radio_rate: 0.08   # $0.08 per 1000 impressions

# ────────────────────────────────────────────────────────────────────────────
#  REPORTING OPTIONS
# ────────────────────────────────────────────────────────────────────────────

reporting:
  # Include sections
  include_summary: true
  include_metadata: true
  include_screenshots: true
  include_metrics: true

  # Export formats
  formats:
    - docx     # Microsoft Word
    - html     # Web format
    - pdf      # PDF (requires additional library)

  # Report sections
  sections:
    - header_with_logos
    - executive_summary
    - coverage_details
    - metrics_dashboard
    - methodology
    - timestamp
